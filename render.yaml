# Render Blueprint - deploys the Django API (frontend goes to Vercel).
services:
  - type: web
    name: truck-trip-planner-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: bash build.sh
    # Migrations also run at start: the free plan's disk is ephemeral.
    startCommand: python manage.py migrate --no-input && gunicorn config.wsgi:application --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost
      # Set to your Vercel URL, e.g. https://truck-trip-planner.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        value: ^https://.*\.vercel\.app$
      - key: NOMINATIM_USER_AGENT
        value: TruckTripPlanner/1.0 (FMCSA ELD log demo)
